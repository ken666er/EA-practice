const qa=[
["My brother, from whence come you as an Entered Apprentice?","From a lodge of the Holy Saints John of Jerusalem."],
["What makes you a Mason?","My Obligation."],
["How do you know yourself to be a Mason?","By being often tried, never denied and ready to be tried again."],
["How shall I know you to be a Mason?","By certain Signs, a Token, a Word and the Perfect Points of my entrance."],
["What are Signs?","Right angles, horizontals and perpendiculars."],
["Give me a Sign.","Give the Due Guard of an Entered Apprentice."],
["What is that?","The Due Guard of an Entered Apprentice."],
["To what does it allude?","To the position in which my hands were placed when taking the Obligation."],
["Give me another Sign.","Give the Penal Sign of an Entered Apprentice."],
["What is that?","The Penal Sign of an Entered Apprentice."],
["To what does it allude?","To the symbolic penalty referred to in my Obligation."],
["What is a Token?","A certain friendly or brotherly grip, whereby one Mason may know Another in the dark as well as in the light."],
["I hele.","I conceal."],
["What do you conceal?","All the secrets of Masons and Masonry, except it be from him or them to whom they of right belong."],
["What is that?","A Grip."],["What Grip?","The Grip of an Entered Apprentice."],["Has it a name?","It has."],
["Give it to me.","I did not so receive it, neither may I so impart it."],
["What will you do that I may obtain a knowledge of it?","I will letter it, or divide it with you."],
["Letter it and begin.","Begin you."],["Nay, the word is yours, you must begin.","B"],["Divide it and begin.","BO"],
["What are the perfect points of your entrance?","The Gutteral, alluding to the throat; the Pectoral, alluding to the breast; the Manual, alluding to hands; and the Pedal, alluding to the feet."],
["What do they represent?","The four cardinal virtues; Temperance, Fortitude, Prudence and Justice."],
["Where were you first prepared to be made a Mason?","In my heart."],
["Where next?","In a room adjacent to a just and lawfully constituted Lodge of Masons."],
["How were you prepared?","By being divested of all minerals and metals; neither Naked nor Clothed, Barefoot nor Shod; Hoodwinked and with a Cable Tow around my Neck; my Left Arm, Left Breast and Left Knee bare; in which condition I was led to the door of the Lodge by a friend, whom I afterwards found to be a brother."],
["How gained you admission?","By three distinct knocks."],
["How were you received?","On the point of a sharp instrument applied to my Naked Left Breast, which was to teach me that, as the instrument was a torture to my flesh, so should the recollection of it ever be to my conscience should I presume to reveal the secrets of Masonry unlawfully."],
["How were you then disposed of?","I was conducted to the center of the Lodge, caused to kneel and attend prayer."],
["After attending prayer, what were you asked?","In whom I put my trust."],["Your answer?","In God."],
["What were you then told?","My trust being in God, my faith was well founded."],
["What did the Worshipful Master do with you?","He made me an Entered Apprentice in due and ancient form."],
["On being brought to light for the first time in a Lodge of Entered Apprentices, what did you observe on the Altar before you?","The Three Great Lights in Masonry, by the aid of the representatives of the Three Lesser Lights."],
["What are the Three Great Lights in Masonry?","The Holy Bible, Square and Compasses."],
["How are they explained?","The Holy Bible is a rule and guide to faith, the Square to square our actions, and the Compasses to circumscribe our desires and keep our passions in due bounds with all mankind, more especially with our Brethren in Masonry."],
["What are the Three Lesser Lights?","The Sun, the Moon and the Worshipful Master."],
["How does an Entered Apprentice wear his apron?","With the flap turned up."],
["Where were you then placed?","In the North East corner of the Lodge as the youngest Entered Apprentice, my feet forming the angle of an oblong Square, my body erect to the worshipful Master in the East."],
["With what were you then presented?","With the working tools of an Entered Apprentice."],
["What are the working tools of an Entered Apprentice?","The Twenty-four inch Gauge and the Common Gavel."],
["How were you then disposed of?","I was ordered to be conducted to the place from whence I came, there to be invested with that of which I had been divested, and return to the Lodge for further instruction."]
];const obligation=[["Obligation — Section 1", "I, (state your full name), of my own free will and accord, in the presence of Almighty God and this Worshipful Lodge erected to Him and dedicated to the Holy Saints John, do hereby and hereon most solemnly and sincerely Promise and Swear, that I will always hele, forever conceal, and never reveal any of the secret arts, parts, or points of the mysteries of Masonry which may have been heretofore, shall be at this time, or at any future period communicated to me as such, to any person or persons whomsoever, except it be to a true and lawful Brother Mason, or within the body of a just and lawfully constituted Lodge of Masons; and not unto him or them, until by due trial, strict examination, or lawful information I shall have found him or them as lawfully entitled to receive them as I myself."], ["Obligation — Section 2", "I furthermore promise and swear, that I will not write these secrets, print, paint, stamp, stain, cut, carve, hew, mark or engrave them, or cause the same to be done on anything moveable or immovable capable of receiving the least impression of a Sign, word, syllable, letter or character whereby they may become legible or intelligible to myself or any other persons under the whole canopy of Heaven and the secrets of Masonry be thereby unlawfully obtained through my unworthiness."], ["Obligation — Section 3", "To all this I most solemnly and sincerely Promise and Swear, with a firm and steadfast resolution to keep and perform the same, without the least equivocation, mental reservation, or secret evasion of mind in me whatsoever; ever bearing in the mind the symbolic penalty, that of having my throat cut from ear to ear, my tongue torn out by it’s roots and with my body buried in the rough sands of the sea a Cable Tow’s length from shore where the tide ebbs and flows twice in the twentyfour hours, should I in the least knowingly or wittingly violate or transgress, this my Solemn and Binding obligation of an Entered Apprentice."], ["Obligation — Section 4", "So Help Me God and keep me steadfast in the due performance of the same."]];let mode=localStorage.eamode||"exam";let i=+(localStorage.getItem("ea_"+mode)||0);const MODE=document.getElementById("mode"),AUTO=document.getElementById("auto");MODE.value=mode;let hints=0;function entries(){return mode==="exam"?qa:obligation}function voice(){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(mode==="exam"?entries()[i][0]:"Obligation, section "+(i+1)+". Begin.");u.rate=.82;speechSynthesis.speak(u)}const Q=document.getElementById("q"),A=document.getElementById("a"),AC=document.getElementById("ac"),P=document.getElementById("p");
function r(){if(i>=entries().length)i=0;hints=0;Q.textContent=entries()[i][0];A.textContent=entries()[i][1];P.textContent=`${mode==="exam"?"Question":"Section"} ${i+1} of ${entries().length}`;AC.classList.add("hide");localStorage.setItem("ea_"+mode,i)}
read.onclick=voice;hint.onclick=()=>{hints+=5;A.textContent=entries()[i][1].split(/\s+/).slice(0,hints).join(" ")+(hints<entries()[i][1].split(/\s+/).length?" …":"");AC.classList.remove("hide")};MODE.onchange=()=>{mode=MODE.value;localStorage.eamode=mode;i=+(localStorage.getItem("ea_"+mode)||0);r()};show.onclick=()=>(A.textContent=entries()[i][1],AC.classList.remove("hide"));next.onclick=()=>{i=(i+1)%entries().length;r();if(AUTO.checked)voice()};back.onclick=()=>{i=(i-1+entries().length)%entries().length;r()};reset.onclick=()=>{i=0;r()};r();
</script>
